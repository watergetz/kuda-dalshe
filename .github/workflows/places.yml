name: Обновить места Москвы

on:
  workflow_dispatch:          # можно запустить вручную: Actions → «Обновить места Москвы» → Run workflow
  schedule:
    - cron: '17 1 * * 1'      # каждый понедельник ночью
  push:
    paths:
      - 'scripts/build_places.py'
      - 'scripts/add_descriptions.py'
      - '.github/workflows/places.yml'

permissions:
  contents: write
  pages: write

concurrency:
  group: places
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Установить чтение карт
        run: pip install osmium==4.3.2

      - name: Скачать карту Москвы
        run: |
          # Центральный федеральный округ от Geofabrik: в нём Москва целиком, включая восточные районы
          curl -fL --retry 3 --retry-delay 20 -o moscow.osm.pbf \
            https://download.geofabrik.de/russia/central-fed-district-latest.osm.pbf
          ls -lh moscow.osm.pbf

      - name: Достать интересные места
        run: python3 scripts/build_places.py moscow.osm.pbf

      - name: Добавить описания из Википедии
        run: python3 scripts/add_descriptions.py

      - name: Сохранить в репозиторий
        run: |
          git config user.name "places-bot"
          git config user.email "places-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Ничего не изменилось"
          else
            git commit -m "Обновить места Москвы"
            git pull --rebase origin main
            git push
            # коммиты робота сами не перезапускают сайт — просим GitHub Pages пересобрать его
            gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
          fi
        env:
          GH_TOKEN: ${{ github.token }}
