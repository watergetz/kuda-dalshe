name: Обновить места Москвы

on:
  workflow_dispatch:          # можно запустить вручную: Actions → «Обновить места Москвы» → Run workflow
  schedule:
    - cron: '17 1 * * 1'      # каждый понедельник ночью
  push:
    paths:
      - 'scripts/build-places.mjs'

permissions:
  contents: write
  pages: write

concurrency:
  group: places
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Скачать места из OpenStreetMap
        run: node scripts/build-places.mjs

      - name: Сохранить в репозиторий
        run: |
          git config user.name "places-bot"
          git config user.email "places-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Ничего не изменилось"
          else
            git commit -m "Обновить места Москвы"
            git push
            # коммиты робота сами не перезапускают сайт — просим GitHub Pages пересобрать его
            gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
          fi
        env:
          GH_TOKEN: ${{ github.token }}
